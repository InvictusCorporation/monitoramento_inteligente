<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Primeiro acesso · Invictus</title><link rel="stylesheet" href="style.css"><script src="local-setup.js" defer></script></head><body><main class="loginview"><form id="setupForm" class="loginbox"><div class="brand"><span class="shield">◇</span><span>INVICTUS<small>Primeiro acesso</small></span></div><h1>Vamos preparar seu teste</h1><p>Intelbras MHDX 1208<br>192.168.1.64 · Porta 554 · Canal 1</p><p>Primeiro, crie sua conta no Invictus.</p><label>Seu nome<input name="name" required maxlength="100" autocomplete="name" value="Tiago"></label><label>Seu e-mail<input name="email" type="email" required maxlength="254" autocomplete="username"></label><label>Crie uma senha para o Invictus<input name="password" type="password" minlength="12" maxlength="128" required autocomplete="new-password"></label><label>Repita a nova senha<input name="confirm" type="password" minlength="12" maxlength="128" required autocomplete="new-password"></label><p>Agora, informe o acesso do DVR, o mesmo usado no painel da Intelbras.</p><label>Usuário do DVR<input name="dvrUsername" required maxlength="256" autocomplete="off" value="admin"></label><label>Senha do DVR<input name="dvrPassword" type="password" required maxlength="256" autocomplete="off"></label><p id="setupStatus" class="formerror" role="status">Verificando instalação…</p><button class="primary" id="setupSubmit" disabled>Criar conta e preparar canal 1</button><a href="/">Já configurei: entrar na minha conta</a></form></main></body></html>
